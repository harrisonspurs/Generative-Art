<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>p5 prototype</title>
  <style>
    html, body {
      margin: 0;
      overflow: hidden;
    }

    canvas {
      display: block;
    }

    /* Small hand-tracking status badge — top right, unobtrusive */
    #hand-status {
      position: fixed;
      top: 14px;
      right: 16px;
      font: 11px/1.5 'Space Mono', monospace, monospace;
      color: rgba(245,242,236,0.4);
      pointer-events: none;
      white-space: pre;
      z-index: 10;
    }
  </style>
</head>
<body>
  <div id="hand-status">hands: —</div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>
  <script src="https://unpkg.com/ml5@1/dist/ml5.min.js"></script>
  <script src="sketch.js"></script>

  <script>
    // Update the status badge every 200ms so you can see what's being tracked
    setInterval(() => {
      const el = document.getElementById('hand-status');
      if (typeof trackedHands === 'undefined' || !trackedHands.length) {
        el.textContent = 'hands: —';
        return;
      }
      const labels = trackedHands.map(h =>
        (h.handedness || '?') + ' ' + Math.round((h.confidence || 0) * 100) + '%'
      );
      el.textContent = 'hands: ' + labels.join('  ·  ');
    }, 200);
  </script>
</body>
</html>
