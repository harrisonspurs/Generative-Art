<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Proximity Without Contact — Installation Mockup</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital@0;1&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0d0d0d;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: 'Space Mono', monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* ── Room ── */
    .room {
      position: relative;
      width: 100vw;
      height: 100vh;
    }

    /* Faint carpet texture — subtle noise via svg filter */
    .room::before {
      content: '';
      position: absolute;
      inset: 0;
      background: #111318;
      opacity: 0.6;
      filter: url(#noise);
    }

    /* ── Projector beam — a trapezoid from ceiling centre down to the floor rect ── */
    .beam {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 60px;
      height: 55%;
      background: linear-gradient(
        to bottom,
        rgba(245,242,236,0.0) 0%,
        rgba(245,242,236,0.04) 60%,
        rgba(245,242,236,0.0) 100%
      );
      clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
      pointer-events: none;
    }

    /* ── Projection rectangle on the floor ──
       Slightly perspective-skewed so it reads as lying flat.
       The iframe with the actual sketch lives inside here.        */
    .projection-wrap {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -46%) perspective(900px) rotateX(18deg);
      width: 62vw;
      height: 46vw;
      max-width: 820px;
      max-height: 580px;
    }

    .projection-rect {
      position: relative;
      width: 100%;
      height: 100%;
      border: 1px solid rgba(245,242,236,0.18);
      overflow: hidden;
      /* Warm projected light bleed on the floor around the rectangle */
      box-shadow:
        0 0 60px 20px rgba(245,242,236,0.07),
        0 0 160px 60px rgba(245,242,236,0.03);
    }

    .projection-rect iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background: #f5f2ec;
      /* Sketch has a warm paper background — desaturate it slightly
         to look like a projection on a surface rather than a screen */
      filter: contrast(0.95) brightness(0.92);
    }

    /* Silhouettes are drawn directly in an SVG overlay inside projection-wrap */

    /* ── Labels ── */
    .label-title {
      position: absolute;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(245,242,236,0.35);
      font-size: 11px;
      letter-spacing: 0.04em;
      white-space: nowrap;
      font-style: italic;
    }

    .label-corner {
      position: absolute;
      top: 24px;
      left: 28px;
      color: rgba(245,242,236,0.2);
      font-size: 10px;
      letter-spacing: 0.03em;
      line-height: 1.8;
    }

    /* SVG filter for carpet grain */
    .filters { position: absolute; width: 0; height: 0; }
  </style>
</head>
<body>

<!-- SVG noise filter for carpet texture -->
<svg class="filters">
  <defs>
    <filter id="noise" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feBlend in="SourceGraphic" mode="multiply"/>
    </filter>
  </defs>
</svg>

<div class="room">

  <!-- carpet noise layer is the ::before pseudo -->

  <!-- projector beam shape -->
  <div class="beam"></div>

  <!-- projection on floor -->
  <div class="projection-wrap">
    <div class="projection-rect">
      <iframe src="index.html" title="Proximity Without Contact sketch"></iframe>
    </div>

      <!-- silhouettes: overhead view, like the sketch's own dots but larger.
           Each figure is a head-circle + cast shadow ellipse beneath it.
           Positioned at different depths to reinforce the floor perspective. -->
      <svg style="position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none;"
           viewBox="0 0 820 580" preserveAspectRatio="none">

        <!-- figure 1: bottom-left, entering the scene, slight cast shadow -->
        <ellipse cx="130" cy="490" rx="30" ry="10" fill="rgba(0,0,0,0.35)"/>
        <circle  cx="130" cy="478" r="22" fill="#1c1c28"/>

        <!-- figure 2: centre, standing still (the two still visitors) -->
        <ellipse cx="390" cy="390" rx="26" ry="9"  fill="rgba(0,0,0,0.3)"/>
        <circle  cx="390" cy="379" r="19" fill="#1c1c28"/>

        <!-- figure 3: just right of centre, also still, facing figure 2 -->
        <ellipse cx="490" cy="385" rx="26" ry="9"  fill="rgba(0,0,0,0.3)"/>
        <circle  cx="490" cy="374" r="19" fill="#1c1c28"/>

        <!-- faint connection line between figures 2 and 3 — mirrors the sketch -->
        <line x1="390" y1="379" x2="490" y2="374"
              stroke="rgba(220,140,65,0.45)" stroke-width="1.5"/>

      </svg>
  </div>

  <!-- corner note -->
  <div class="label-corner">
    floor projection<br>
    14m × 10m
  </div>

  <!-- concept sentence at bottom -->
  <div class="label-title">
    Cities teach us to leave each other alone — and that politeness is what makes it rare when two strangers stop.
  </div>

</div>

</body>
</html>
